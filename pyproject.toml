[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laliga-predictor"
version = "1.0.0"
description = "La Liga match probabilities: full-time, half-time, and top scorelines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.2.3",
    "python-dotenv==1.1.1",
    "requests==2.32.5",
    "scipy==1.15.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
laliga = "laliga.cli:main"

[tool.setuptools.packages.find]
include = ["laliga*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

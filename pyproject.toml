[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-short"
version = "0.1.0"
description = "A-share short-term recommendations, backtest, and paper trading (no live orders)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "baostock>=0.8.8",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "requests>=2.31",
  "scikit-learn>=1.6",
  "streamlit>=1.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ashare = "ashare.cli:main"

[tool.setuptools.packages.find]
include = ["ashare*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
